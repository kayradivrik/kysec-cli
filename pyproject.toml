[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secai"
version = "0.1.0"
description = "SecOps CLI Asistanı & Vaka Defteri"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
secai = "secai.cli:app"

