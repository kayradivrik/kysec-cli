[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secai"
version = "0.4.0"
description = "SecOps CLI Asistanı & Vaka Defteri"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kayra Divrik (sonuscato)" }
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.scripts]
secai = "secai.cli:app"
ksec = "secai.cli:app"
